name: release
on:
  workflow_dispatch:
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: soksak-plugins/soksak-plugin-terminal-ghostty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: soksak-plugins/soksak-plugin-terminal-ghostty
      - name: Install the immutable public spec package
        run: |
          mkdir -p .dependency/spec-package
          curl -fsSL https://github.com/soksak-ai/soksak-spec/releases/download/v0.0.23/soksak-ai-plugin-spec-0.0.23.tgz -o .dependency/soksak-spec.tgz
          echo "707f108e69ebd4deac1e5572b9ffb6a5dc8db4953b8948c38a7ac315b189ff1b  .dependency/soksak-spec.tgz" | sha256sum -c -
          tar -xzf .dependency/soksak-spec.tgz -C .dependency/spec-package --strip-components=1
          test -z "$(find .dependency/spec-package -type l -print -quit)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: soksak-plugins/soksak-plugin-terminal-ghostty/frontend/package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: soksak-plugins/soksak-plugin-terminal-ghostty/frontend/package.json
      - name: Run the repeatable owner proof
        run: node .dependency/spec-package/release-template/verify-plugin-release.mjs --commit "${{ github.sha }}" --out dist-release
      - id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.SOKSAK_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOKSAK_RELEASE_PRIVATE_KEY }}
          permission-administration: read
          permission-contents: write
      - name: Publish the canonical immutable release
        env:
          SOKSAK_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          test "$(gh api "repos/${{ github.repository }}/immutable-releases" --jq '.enabled and .enforced_by_owner')" = true || { echo "owner-enforced immutable releases must be enabled before tagging" >&2; exit 1; }
          node .dependency/spec-package/release-template/publish-canonical-release.mjs --repository "${{ github.repository }}" --commit "${{ github.sha }}" --artifacts "$PWD/dist-release" --manifest "$PWD/dist-release/release.json"
