name: release
on:
  workflow_dispatch:
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: soksak-plugins/soksak-plugin-terminal-ghostty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: soksak-plugins/soksak-plugin-terminal-ghostty
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: soksak-ai/soksak-spec
          ref: 418d6064fcdc5885be1ff73fd898fd7a0f778a0f
          path: soksak-plugins/soksak-plugin-terminal-ghostty/.dependency/soksak-spec
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.7.0"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: "11.22.0"
      - name: Build the exact public spec
        working-directory: soksak-plugins/soksak-plugin-terminal-ghostty/.dependency/soksak-spec
        run: |
          pnpm --config.node-linker=hoisted --config.symlink=false install --frozen-lockfile
          pnpm build
          test -z "$(find . -type l -print -quit)"
      - name: Verify and build the plugin
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend typecheck
          pnpm --dir frontend test
          pnpm --dir frontend build
          git diff --exit-code -- main.js
      - name: Build and validate release documents
        run: |
          node .dependency/soksak-spec/packages/plugin-spec/release-template/build-release.mjs --commit "${{ github.sha }}" --out dist-release
          node .dependency/soksak-spec/packages/plugin-spec/bin/validate.mjs release dist-release/release.json
          node .dependency/soksak-spec/packages/plugin-spec/bin/validate.mjs conformance dist-release/conformance-*.json --release dist-release/release.json --plugin-manifest plugin.json
      - id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.SOKSAK_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOKSAK_RELEASE_PRIVATE_KEY }}
          permission-administration: read
          permission-contents: write
      - name: Publish the canonical immutable release
        env:
          SOKSAK_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          test "$(gh api "repos/${{ github.repository }}/immutable-releases" --jq '.enabled and .enforced_by_owner')" = true || { echo "owner-enforced immutable releases must be enabled before tagging" >&2; exit 1; }
          node .dependency/soksak-spec/packages/plugin-spec/release-template/publish-canonical-release.mjs --repository "${{ github.repository }}" --commit "${{ github.sha }}" --artifacts "$PWD/dist-release" --manifest "$PWD/dist-release/release.json"
